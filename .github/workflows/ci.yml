name: Engineering verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRUST_MODEL_API_KEY: ""
      TRUST_MODEL_NAME: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          uv sync --locked
      - name: Verify synthetic import integrity
        run: uv run python scripts/demo_offline.py
      - name: Verify offline toy scoring
        run: uv run python scripts/evaluate_paragraphs.py --bundle evaluation-fixtures/toy-bundle.json --output .runtime/ci-toy-score
      - name: Run engineering regressions with external model traffic blocked
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
