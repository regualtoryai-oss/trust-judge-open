[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-judge"
version = "0.1.0"
description = "Evidence-grounded multi-agent analysis workbench foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "openai>=2,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "jieba>=0.42,<1",
  "rank-bm25>=0.2,<1",
  "cn2an==0.5.24",
  "json-repair==0.64.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
trust-judge = "app.cli:main"
